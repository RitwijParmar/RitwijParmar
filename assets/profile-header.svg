<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Ritwij Aryan Parmar - Backend and AI Systems Engineer</title>
  <desc id="desc">A compact systems console showing an inference request moving through a scheduler and runtime.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b23"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="880" height="200" fill="url(#background)"/>
  <path d="M0 34.5H880M0 165.5H880" stroke="#26303b"/>
  <path d="M442 35V165" stroke="#26303b" stroke-dasharray="2 6"/>

  <text x="24" y="23" class="mono" font-size="10" fill="#8b949e">~/profile  branch:main</text>
  <text x="24" y="183" class="mono" font-size="10" fill="#8b949e">ritwij://systems/portfolio</text>
  <text x="856" y="183" text-anchor="end" class="mono" font-size="10" fill="#8b949e">build 2026.09</text>

  <text x="24" y="91" font-size="34" font-weight="650" fill="#f0f6fc">Ritwij Aryan Parmar</text>
  <text x="24" y="118" font-size="13" font-weight="650" fill="#ff9b50">BACKEND &amp; AI SYSTEMS ENGINEER</text>
  <text x="24" y="142" class="mono" font-size="10.5" fill="#9da7b3">Inference · Evaluation · Reliability · C++ Systems</text>

  <g>
    <rect x="470" y="54" width="174" height="57" rx="5" fill="#161d26" stroke="#2b3642"/>
    <circle cx="484" cy="68" r="3" fill="#ff9b50"/>
    <text x="494" y="72" class="mono" font-size="9" fill="#9da7b3">POST /v1/completions</text>
    <rect x="482" y="82" width="98" height="4" rx="2" fill="#2b3642"/>
    <rect x="482" y="92" width="132" height="4" rx="2" fill="#2b3642"/>
    <text x="482" y="107" class="mono" font-size="8" fill="#56d4c5" opacity="0">200 OK · streamed
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <g>
    <rect x="662" y="54" width="192" height="57" rx="5" fill="#161d26" stroke="#2b3642"/>
    <text x="676" y="70" class="mono" font-size="8" fill="#9da7b3">RUNTIME / SIGNALS</text>
    <text x="676" y="87" class="mono" font-size="9" fill="#56d4c5">queue 08 · batch 16</text>
    <rect x="676" y="96" width="151" height="4" rx="2" fill="#2b3642"/>
    <rect x="676" y="96" width="0" height="4" rx="2" fill="#56d4c5">
      <animate attributeName="width" values="0;151;151;0" keyTimes="0;0.65;0.92;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="470" y="133" class="mono" font-size="8.5" fill="#ff9b50">request</text>
  <text x="581" y="133" class="mono" font-size="8.5" fill="#9da7b3">scheduler</text>
  <text x="715" y="133" class="mono" font-size="8.5" fill="#9da7b3">runtime</text>
  <text x="815" y="133" class="mono" font-size="8.5" fill="#56d4c5">tokens</text>
  <path d="M470 150H840" stroke="#2b3642"/>
  <circle cx="470" cy="150" r="3.5" fill="#ff9b50">
    <animate attributeName="cx" values="470;840" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="150" r="3" fill="#56d4c5">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <rect x="843" y="171" width="7" height="11" fill="#ff9b50">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
